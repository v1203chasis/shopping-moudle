name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动后端服务（后台）
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: 运行测试
        run: pytest -v

        
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包项目
        run: |
          zip -r shopping-moudle.zip . -x "*.git*" -x "*.venv*" -x "*__pycache__*"

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: shopping-moudle-package
          path: shopping-moudle.zip
